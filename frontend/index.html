<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RetinaGuard Triage</title>

<style>

.nav.on{background:linear-gradient(90deg,var(--a2),transparent);color:var(--tx);border-color:var(--ac)}
.tag{margin-top:auto;border:1px solid var(--bd);border-radius:10px;padding:10px;color:var(--mu);font-size:11px}

@media(max-width:900px){#app{flex-direction:column}aside{width:auto;flex-direction:row;flex-wrap:wrap;border:0}.tag,.logo small{display:none}.g2,.g3,.g4,.g6,.g21{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g2,.g3,.g4,.g6,.g21{grid-template-columns:1fr}}
.c{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:12px;min-width:0;overflow:hidden}
.btn{background:var(--p2);color:var(--tx);border:1px solid var(--ac);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
.btn:hover,.btn.on{background:var(--a2);color:#fff}.btn.sm{padding:3px 8px;font-size:12px}
.pill{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;border:1px solid}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:4px 0}.fl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.big{font-size:22px;font-weight:700}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:500}
tr.cl{cursor:pointer}tr.cl:hover,tr.hl{background:var(--p2)}
canvas{max-width:100%;border-radius:8px;background:#000;display:block}
.drop{border:2px dashed var(--ac);border-radius:12px;padding:18px;text-align:center}.drop.ov{background:var(--p2)}
.dn{width:110px;height:110px}.dn .t1{font-size:18px;font-weight:700;fill:var(--tx)}.dn .t2{font-size:7px;fill:var(--mu)}
.bar{height:8px;border-radius:4px;background:var(--p2);overflow:hidden;flex:1}.bar i{display:block;height:100%}
input[type=text],select{background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font:inherit}
input[type=range]{accent-color:var(--ac);width:100%}
.sw{width:38px;height:20px;border-radius:10px;background:var(--p2);border:1px solid var(--bd);position:relative;cursor:pointer;flex:none}.sw i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--mu);transition:.2s}.sw.on{background:var(--a2)}.sw.on i{left:20px;background:#fff}
.refer{background:#f5c45133;border-color:var(--wa);color:var(--wa)}.ok{background:#1fd6b422;border-color:var(--ac);color:var(--ac)}.warn{background:#ef4b5b33;border-color:var(--rd);color:var(--rd)}
.step{display:flex;gap:8px;align-items:center;cursor:pointer;padding:4px 0}.step b{width:20px;height:20px;border:1px solid var(--ac);border-radius:50%;display:grid;place-items:center;font-size:11px}.step.d b{background:var(--ac);color:#000}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--a2);color:#fff;padding:8px 16px;border-radius:8px;display:none;z-index:20}
.rp{background:#f3f8f8;color:#0b2a33;border-radius:10px;padding:12px}.rp .mu{color:#4d7076}
.sc{overflow-x:auto}
</style></head><body>
<div id="app"><aside id="side"></aside><main><header id="hd"></header><div id="pg"></div></main></div><input id="weights-file" type="file" accept=".pt,.pth" hidden><div id="toast"></div>
<script>

(()=>{const nativeFetch=window.fetch.bind(window);let prompted=false;window.fetch=async(input,init={})=>{const addToken=(cfg)=>{const h=new Headers(cfg.headers||{});const t=sessionStorage.getItem('rg_api_token');if(t)h.set('Authorization','Bearer '+t);return {...cfg,headers:h}};let cfg=addToken(init);let res=await nativeFetch(input,cfg);if(res.status===401&&!prompted&&!sessionStorage.getItem('rg_api_token')){prompted=true;const token=window.prompt('This RetinaGuard server requires an API access token. Enter the operator token, or Cancel to continue without remote API access:');if(token){sessionStorage.setItem('rg_api_token',token);cfg=addToken(init);res=await nativeFetch(input,cfg)}}return res}})();
const GR=['No DR','Mild NPDR','Moderate NPDR','Severe NPDR','Proliferative DR'],GC=['#2dd4a8','#4f8cff','#f5b83d','#ef4b5b','#a66bff'];

function make(seed,o={}){const r=rng(seed),g=o.g??[0,0,1,1,2,2,2,3,4][Math.floor(r()*9)];
 const mb=((S&&S.models.find(m=>m.n==S.set.model))||{qwk:.82}).qwk,conf=Math.min(.97,.62+r()*.3+(mb-.75)*.5);

 const n=[g?g*4+Math.floor(r()*5):Math.floor(r()*2),g>=2?g*2+Math.floor(r()*3):g,g>=2?g*2+Math.floor(r()*3):0],pts=[];
 n.forEach((k,t)=>{for(let i=0;i<k;i++){const a=r()*6.28,d=Math.sqrt(r())*.8;pts.push({t,x:t==2?.05+Math.cos(a)*d*.35:Math.cos(a)*d,y:t==2?.25+Math.sin(a)*d*.35:Math.sin(a)*d})}});
 const q=o.q||{b:62+Math.floor(r()*34),c:62+Math.floor(r()*34),s:62+Math.floor(r()*34),f:70+Math.floor(r()*28)};
 return{id:o.id||Date.now()+Math.floor(Math.random()*999),seed,g,p,conf,u:(1-conf)*.7+r()*.08,n,pts,q,date:o.date||Date.now(),pid:o.pid||'RG00'+(100+Math.floor(r()*900)),age:40+Math.floor(r()*35),sex:r()>.5?'Male':'Female',file:o.file||'sample_placeholder.jpg',img:o.img||0,note:'',fu:0,model:S?S.set.model:'EfficientNet-B3',source:o.source||'sample_demo'}}
function seed(){const gs=[2,0,1,3,0,2];S={view:0,sel:0,tab:'Lesion',ov:[1,1,1],cmp:0,range:30,q:'',gf:'all',ds:0,set:{model:'EfficientNet-B3',conf:.7,unc:true,uth:.2,df:'dmy',anon:false,audit:true,autosave:true,hints:true,alerts:true,theme:'auto',def:0,size:512,access:'Research Only'},sec:'General',models:mkModels(),tasks:[0,0,0,0],notes:[],recs:[],hist:0};
 gs.forEach((g,i)=>S.recs.push(make(101+i*37,{g,id:i+1,date:Date.now()-i*864e5-i*36e5,pid:'RG00'+(123-i),file:'fundus_00'+(i+1)+'.jpg'})));S.sel=1}
try{S=JSON.parse(localStorage.getItem('rg1'))}catch(e){S=null}
if(!S||!S.recs)seed();
function save(){if(S.set.autosave)try{localStorage.setItem('rg1',JSON.stringify(S))}catch(e){}if(SYNC){clearTimeout(ST);ST=setTimeout(()=>fetch('/api/state',{method:'PUT',body:JSON.stringify(S)}).catch(()=>{}),600)}}
S.recs.forEach(r=>{if(r.img)loadImg(r)});
function loadImg(r){const i=new Image();i.onload=()=>{IM[r.id]=i;draw()};i.src=r.img}
const cur=()=>S.recs.find(r=>r.id==S.sel)||S.recs[0];
const triage=a=>{const s=S.set,m=Math.min(a.q.b,a.q.c,a.q.s,a.q.f);if(m<50)return['Retake image','warn'];if(a.g>=2||(s.unc&&(a.conf<s.conf||a.u>s.uth)))return['Refer to Specialist','refer'];return a.g==1?['Rescreen in 6 months','ok']:['Routine rescreen in 12 months','ok']};
const fd=d=>{d=new Date(d);return S.set.df=='iso'?d.toISOString().slice(0,10):String(d.getDate()).padStart(2,'0')+' '+d.toLocaleString('en',{month:'short'})+' '+d.getFullYear()},tm=d=>new Date(d).toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'});
const pid=a=>S.set.anon?a.pid.slice(0,2)+'•••'+a.pid.slice(-2):a.pid,qa=a=>Math.round((a.q.b+a.q.c+a.q.s+a.q.f)/4);
const mdl=()=>S.models.find(m=>m.n==S.set.model)||S.models[0],best=()=>S.models.reduce((a,b)=>b.qwk>a.qwk?b:a);
const inR=a=>Date.now()-a.date<=S.range*864e5;
const quad=a=>{const o={};a.pts.forEach(p=>{const k=(p.y<0?'Upper ':'Lower ')+(p.x<0?'Temporal':'Nasal');o[k]=(o[k]||0)+1});return['Upper Temporal','Upper Nasal','Lower Nasal','Lower Temporal'].map(k=>[k,o[k]||0])};
function donut(v,c,t,s){const T=v.reduce((a,b)=>a+b,0)||1;let o=0;return`<svg viewBox="0 0 100 100" class="dn">`+v.map((x,i)=>{const l=x/T*251.3,e=`<circle cx="50" cy="50" r="40" fill="none" stroke="${c[i]}" stroke-width="12" stroke-dasharray="${l} ${251.3-l}" stroke-dashoffset="${-o}" transform="rotate(-90 50 50)"/>`;o+=l;return e}).join('')+`<text x="50" y="52" text-anchor="middle" class="t1">${t}</text><text x="50" y="63" text-anchor="middle" class="t2">${s||''}</text></svg>`}
const ring=(p,c)=>donut([p,100-p],[c||'#1fd6b4','#ffffff18'],p+'%','');
const bar=(l,v,c)=>`<div class="row"><span style="width:90px">${l}</span><div class="bar"><i style="width:${v}%;background:${c||'var(--ac)'}"></i></div><b style="width:36px;text-align:right">${Math.round(v)}%</b></div>`;
const pill=a=>`<span class="pill" style="color:${GC[a.g]};border-color:${GC[a.g]}">${GR[a.g]}</span>`;
const sw=k=>`<span class="sw ${S.set[k]?'on':''}" data-a="tg" data-v="${k}"><i></i></span>`;
const cv=(a,w,ov)=>`<canvas width="${w}" height="${w}" data-r="${a.id}" data-ov="${ov||''}" style="width:100%"></canvas>`;
function fundus(c,a,ov){const x=c.getContext('2d'),w=c.width,R=w*.48,cx=w/2,cy=w/2;x.fillStyle='#000';x.fillRect(0,0,w,w);x.save();x.beginPath();x.arc(cx,cy,R,0,7);x.clip();
 if(a.img&&IM[a.id])x.drawImage(IM[a.id],cx-R,cy-R,2*R,2*R);else{let g=x.createRadialGradient(cx-R*.2,cy,R*.1,cx,cy,R);g.addColorStop(0,'#e9923f');g.addColorStop(.7,'#c4621f');g.addColorStop(1,'#6e2d0e');x.fillStyle=g;x.fillRect(0,0,w,w);

 for(let i=0;i<16;i++){const an=(i/16)*6.28,ex=cx+Math.cos(an)*R*.95,ey=cy+Math.sin(an)*R*.95;x.strokeStyle='rgba(130,25,10,.75)';x.lineWidth=R*(.03-i%3*.007);x.beginPath();x.moveTo(dx,dy);x.quadraticCurveTo((dx+ex)/2+r()*R*.3,(dy+ey)/2+r()*R*.3,ex,ey);x.stroke()}

 g=x.createRadialGradient(cx+R*.1,cy+R*.02,0,cx+R*.1,cy+R*.02,R*.16);g.addColorStop(0,'rgba(80,25,5,.7)');g.addColorStop(1,'rgba(80,25,5,0)');x.fillStyle=g;x.beginPath();x.arc(cx+R*.1,cy,R*.16,0,7);x.fill();
 a.pts.forEach(p=>{x.fillStyle=p.t==2?'#f6e27a':'#7a1010';x.beginPath();x.arc(cx+p.x*R,cy+p.y*R,R*(p.t==1?.03:p.t?.02:.012),0,7);x.fill()})}
 if(ov=='heat'&&HT[a.id]){x.globalAlpha=.6;x.drawImage(HT[a.id],cx-R,cy-R,2*R,2*R);x.globalAlpha=1}else if(ov=='heat')a.pts.forEach(p=>{const X=cx+p.x*R,Y=cy+p.y*R,g=x.createRadialGradient(X,Y,0,X,Y,R*.18);g.addColorStop(0,'rgba(255,40,0,.6)');g.addColorStop(.5,'rgba(255,220,0,.3)');g.addColorStop(1,'rgba(0,200,255,0)');x.fillStyle=g;x.fillRect(X-R*.2,Y-R*.2,R*.4,R*.4)});
 x.restore();
 if(ov=='box'||ov=='dot')a.pts.forEach(p=>{if(!S.ov[p.t])return;x.strokeStyle=LC[p.t];x.lineWidth=2;const X=cx+p.x*R,Y=cy+p.y*R,s=R*.05;if(p.t==0){x.beginPath();x.arc(X,Y,s,0,7);x.stroke()}else x.strokeRect(X-s,Y-s,2*s,2*s)})}
function draw(){document.querySelectorAll('canvas[data-r]').forEach(c=>{const a=S.recs.find(r=>r.id==c.dataset.r);if(a)fundus(c,a,c.dataset.ov)});
 const l=$('#ln');if(l){}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',2400)}
function note(m){if(S.set.alerts){S.notes.unshift(m)}toast(m)}
/* ---------- pages ---------- */
function P0(){const a=cur();const steps=['Image Quality Gate','DR Assessment','Triage & Confidence'];
 let h=`<div class="c" style="margin-bottom:12px"><div class="fl" style="justify-content:space-between"><div><h1>Welcome to RetinaGuard Triage</h1><span class="mu">Upload a retinal fundus image to get an AI-powered analysis for diabetic retinopathy screening.</span></div><div class="fl">${steps.map((s,i)=>`<div class="step ${busy?(i==0?'d':''):'d'}"><b>${i+1}</b>${s}</div>`).join('')}</div></div></div>`;
 h+=`<div class="g g3"><div class="c"><h2>1. Upload Fundus Image</h2><div class="drop" id="dz">${busy?'<div class="big">Analyzing…</div><div class="bar"><i style="width:60%;background:var(--ac)"></i></div>':`<div style="font-size:28px">☁</div>Drag & drop your image here<br>or<br><br><button class="btn" data-a="pick">Choose File</button><div class="mu" style="font-size:11px;margin-top:6px">JPG, PNG · Max 10MB</div>`}</div><input type="file" id="fi" accept="image/*" hidden>
 <div class="row" style="margin-top:8px"><b>Recent Uploads</b><a class="mu" style="cursor:pointer" data-a="nav" data-v="2">View all</a></div>${S.recs.slice(0,4).map(r=>`<div class="row cl" style="cursor:pointer" data-a="sel" data-v="${r.id}"><span>${r.file}<br><small class="mu">${fd(r.date)} ${tm(r.date)}</small></span><span>›</span></div>`).join('')}</div>`;
 if(!a)return h+`<div class="c">No images yet. Upload one to begin.</div></div>`;
 const t=triage(a),qm=['Brightness','Contrast','Sharpness','Field Coverage'],qv=[a.q.b,a.q.c,a.q.s,a.q.f];
 h+=`<div class="c"><div class="row"><h2>2. Image Preview & Quality Check</h2><span class="pill ok">Complete</span></div><div class="g g2" style="margin:0"><div style="overflow:hidden;border-radius:8px"><div style="transform:scale(${zoom}) rotate(${rot}deg);transition:.3s">${cv(a,360)}</div></div><div><b>Quality Score</b><div style="text-align:center">${ring(qa(a))}<div class="ok" style="background:none">${qa(a)>=75?'Good Quality':qa(a)>=50?'Fair Quality':'Poor Quality'}</div></div>${qm.map((m,i)=>`<div class="row"><span>${m}</span><b style="color:${qv[i]>=60?'var(--ac)':'var(--rd)'}">${qv[i]>=75?'Good':qv[i]>=60?'Fair':'Poor'}</b></div>`).join('')}</div></div>
 <div class="fl" style="margin-top:8px"><button class="btn sm" data-a="zoom">🔍 Zoom ×${zoom}</button><button class="btn sm" data-a="rot">↻ Rotate</button><button class="btn sm" data-a="nav" data-v="1">Compare / Analyze</button></div></div>
 <div class="c"><h2>3. Analysis Result</h2><div class="row"><span class="pill" style="color:${GC[a.g]};border-color:${GC[a.g]};font-size:14px">${GR[a.g]}</span><span class="pill ${t[1]}">${t[0]}</span></div>
 <div class="fl" style="margin:8px 0"><div style="text-align:center">${ring(Math.round(a.conf*100))}<small class="mu">Calibrated confidence</small></div><div style="flex:1;min-width:140px">${GR.map((g,i)=>bar(g.replace(' NPDR','').replace(' DR',''),a.p[i]*100,GC[i])).join('')}</div></div>
 <button class="btn" data-a="rep" data-v="${a.id}" style="width:100%">View Detailed Report</button></div></div>`;
 const m=mdl(),fl=S.recs.filter(r=>triage(r)[1]!='ok').length,tk=['Process more images','Update model with lesion segmentation','Add offline (edge) mode','Prepare final report & slides'];
 h+=`<div class="g g3"><div class="c"><h2>Quick Stats</h2><div class="row"><span>Total Images</span><b class="big">${S.recs.length}</b></div><div class="row"><span>Processed</span><b class="big">${S.recs.length}</b></div><div class="row"><span>Flagged for Review</span><b class="big" style="color:var(--wa)">${fl}</b></div></div>
 <div class="c"><h2>Lesion Detection</h2><div class="g g2" style="margin:0">${cv(a,200,'box')}<div>${LT.map((l,i)=>`<div class="row"><span style="color:${LC[i]}">● ${l}</span><b>${a.n[i]}</b></div>`).join('')}<div class="mu">Total ${a.pts.length}</div></div></div></div>
 <div class="c"><h2>Next Steps</h2>${tk.map((s,i)=>`<div class="step ${S.tasks[i]?'d':''}" data-a="task" data-v="${i}"><b>${S.tasks[i]?'✓':i+1}</b>${s}</div>`).join('')}</div></div>
 <div class="g g2"><div class="c"><h2>Performance Metrics (${m.n})</h2><div class="g g4" style="margin:0">${[['QWK',m.qwk],['Macro-F1',m.f1],['AUROC',m.auc],['ECE',m.ece]].map(x=>`<div><div class="mu">${x[0]}</div><div class="big">${x[1].toFixed(2)}</div></div>`).join('')}</div></div>
 <div class="c"><h2>Cross-Dataset Performance</h2>${['APTOS (val)','IDRiD (test)','Messidor-2 (test)'].map((d,i)=>bar(d,(m.auc*100-i*4-m.ece*30),['#4f8cff','#1fd6b4','#a8e063'][i])).join('')}</div></div>

function watchTraining(){let ticks=0;const timer=setInterval(async()=>{ticks++;try{const r=await fetch('/api/train/status'),j=await r.json();if(j.running){if(ticks%5===0)toast('Training in progress… check Dataset & Models for server log');}else{clearInterval(timer);if(j.return_code===0&&j.model_loaded){BACK=1;toast('Training finished. Trained weights loaded.');const m=await fetch('/api/metrics').then(x=>x.json()).catch(()=>null);if(m&&m.qwk){METRICS_READY=1;S.models[0]={n:m.model,qwk:m.qwk,f1:m.macro_f1,auc:m.auroc||0,ece:m.ece};S.set.model=m.model;}render()}else toast('Training stopped or failed. Review the server training log in outputs/train.log.');}if(ticks>3600)clearInterval(timer)}catch(e){if(ticks>30){clearInterval(timer);toast('Could not read training status; check server logs.')}}},2000)}
document.addEventListener('click',e=>{if(!e.target.closest('#dd')&&!e.target.closest('.bell')){const d=$('#dd');if(d)d.remove()}const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v,A=cur();
 switch(a){case'nav':go(+v);break;case'sel':S.sel=+v;t.dataset.go?go(1):render();break;case'pick':$('#fi').click();break;
 case'zoom':zoom=zoom>=2?1:zoom+.5;render();break;case'rot':rot+=90;render();break;case'tab':S.tab=v;render();break;case'ov':S.ov[+v]=+!S.ov[+v];render();break;
 case'task':S.tasks[+v]^=1;render();break;case'rep':S.rep=+v;S.sel=+v;t.dataset.stay?render():go(3);break;
 case'del':if(confirm('Delete this record?')){S.recs=S.recs.filter(r=>r.id!=+v);render()}break;
 case'nt':{const r=S.recs.find(r=>r.id==+v),n=prompt('Note for '+r.pid,r.note);if(n!==null){r.note=n;render()}break}
 case'dl':dl('retinaguard_'+v+'.csv',csv(v));break;
 case'pdf':{if(!A)return toast('Select a report first');fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({record_id:pid(A),grade:A.g,model:A.model||mdl().n,model_sha256:A.model_sha256||null,generated_at_utc:A.generated_at_utc||null,source:A.source||'sample_demo',confidence:A.conf,uncertainty:A.u,gate_passed:'passed',quality:A.q,lesion_counts:A.n})}).then(async r=>{if(!r.ok){const j=await r.json().catch(()=>({}));throw Error(j.detail||'PDF report failed')}return r.blob()}).then(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='retinaguard_research_report.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('PDF report downloaded')}).catch(err=>toast(err.message));break}
 case'share':navigator.clipboard&&navigator.clipboard.writeText(`RetinaGuard: ${pid(A)} ${GR[A.g]} (${Math.round(A.conf*100)}%) – ${triage(A)[0]}`).then(()=>toast('Summary copied to clipboard'),()=>toast('Copy blocked by browser'));break;
 case'fu':A.fu=Date.now()+90*864e5;note('Follow-up scheduled for '+pid(A)+' on '+fd(A.fu));render();break;
 case'ds':S.ds=+v;render();break;case'dataset':{const urls=['https://www.kaggle.com/competitions/aptos2019-blindness-detection/data','https://ieee-dataport.org/open-access/indian-diabetic-retinopathy-image-dataset-idrid','https://www.adcis.net/en/third-party/messidor2/','https://www.kaggle.com/c/diabetic-retinopathy-detection/data',null];const u=urls[+v];if(u)window.open(u,'_blank','noopener');else toast('This custom dataset is local only; configure its path on the server.');break}case'model':S.set.model=v;toast('Active model: '+v);render();break;case'toast':toast(v);break;
 case'weights':$('#weights-file').click();break;
 case'export':fetch('/api/model/export',{method:'POST'}).then(async r=>{if(!r.ok){const j=await r.json().catch(()=>({}));throw Error(j.detail||'Export failed')}return r.blob()}).then(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='retinaguard_model.onnx';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('ONNX model exported')}).catch(err=>toast(err.message));break;
 case'train':{const csv=prompt('Absolute path to labelled training CSV on the server (APTOS train.csv):');if(!csv)break;const images=prompt('Absolute path to the folder containing the retinal images:');if(!images)break;const epochs=prompt('Number of training epochs (1-100):','15');if(!epochs)break;fetch('/api/train',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({csv,images,epochs})}).then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.detail||'Training could not start');toast(j.message);watchTraining()} ).catch(err=>toast(String(err.message||err)));break}
 case'sec':S.sec=v;render();break;case'tg':S.set[v]=!S.set[v];render();break;
 case'clear':if(confirm('Reset all records to sample data?')){const s=S.set;seed();S.set=s;render()}break;
 case'exp':dl('retinaguard_config.json',JSON.stringify(S.set,null,1));break;
 case'rst':if(confirm('Restore factory settings?')){seed();render()}break;
 case'bell':{const d=document.createElement('div');d.id='dd';d.innerHTML=S.notes.length?S.notes.slice(0,6).map(n=>`<div class="row">${n}</div>`).join(''):'<div class="mu">No new alerts</div>';document.body.appendChild(d);S.notes=[];$('#hd .bell b')&&$('#hd .bell b').remove();e.stopPropagation();break}}});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='fi')return readFile(t.files[0]);if(t.id=='weights-file'&&t.files[0]){const fd=new FormData();fd.append('file',t.files[0]);fetch('/api/model/upload',{method:'POST',body:fd}).then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.detail||'Model upload failed');BACK=1;toast(j.message);render()}).catch(err=>toast(err.message));t.value='';return}if(t.dataset.a=='gf'){S.gf=t.value=='all'?'all':+t.value;render()}else if(t.dataset.a=='rg'){S.range=+t.value;render()}else if(t.dataset.a=='ov'){}
 else if(t.dataset.k){const k=t.dataset.k;S.set[k]=t.type=='range'?+t.value:['size','def'].includes(k)?+t.value:t.value;render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='q'){S.q=t.value;render()}else if(t.type=='range'){const k=t.dataset.k,n=$(k=='conf'?'#v1':'#v2');S.set[k]=+t.value;n.textContent=(+t.value).toFixed(2)}});
document.addEventListener('dragover',e=>{if(e.target.closest('#dz')){e.preventDefault();$('#dz').classList.add('ov')}});
document.addEventListener('drop',e=>{if(e.target.closest('#dz')){e.preventDefault();readFile(e.dataTransfer.files[0])}});
S.view=S.view||S.set.def||0;render();
fetch('/api/health').then(r=>r.json()).then(async j=>{BACK=j.model_loaded?1:0;SYNC=1;
 const st=await fetch('/api/state').then(r=>r.json()).catch(()=>null);if(st&&st.recs&&st.recs.length){S=st;S.recs.forEach(r=>{if(r.img)loadImg(r)})}
 const m=await fetch('/api/metrics').then(r=>r.json()).catch(()=>null);if(m&&m.qwk){METRICS_READY=1;S.models[0]={n:m.model,qwk:m.qwk,f1:m.macro_f1,auc:m.auroc||0,ece:m.ece};S.set.model=m.model}
 render()}).catch(()=>render());
